# WhisperMining paneli — /etc/nginx/conf.d/whisperkripto.conf içindeki 443 server bloğuna,
# mevcut "location /bj-sync/" bloğunun hemen ALTINA (ve "location /" bloğunun ÜSTÜNE) eklenir.
# Sitenin diğer adreslerine dokunmaz: sadece /mining ile başlayan istekler 3120 portuna gider.

    # Flash imajı ve agent paketleri: nginx doğrudan diskten sunar (GB'lık dosyalar, kesilen indirme devam eder)
    location ^~ /mining/downloads/ {
        alias /opt/mining/downloads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }

    # Madencilik paneli (pm2: mining)
    location = /mining {
        return 301 /mining/;
    }
    location /mining/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
