# GitHub'da Actions → "WhisperMining imajı" → Run workflow ile çalıştırılır.
# Çıktı (img.xz + sha256) iş bitince "Artifacts" bölümünden indirilir.
name: WhisperMining imajı

on:
  workflow_dispatch:
    inputs:
      version:
        description: "İmaj sürümü (ör. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Disk yeri aç
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Agent testleri
        run: cd agent && python3 -m unittest discover -s tests -v

      - name: İmajı derle
        run: sudo VERSION=${{ inputs.version }} bash image/build-image.sh

      - name: Yükle
        uses: actions/upload-artifact@v4
        with:
          name: whispermining-${{ inputs.version }}
          path: |
            image/out/*.img.xz
            image/out/*.sha256
          compression-level: 0
          retention-days: 14
